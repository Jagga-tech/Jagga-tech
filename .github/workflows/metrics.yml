name: GitHub Metrics

on:
  # Refresh twice a day
  schedule:
    - cron: "0 */12 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate metrics card
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          # Built-in token — no secret setup required. Swap for a personal
          # access token (secrets.METRICS_TOKEN) later if you want fuller
          # cross-repo stats.
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Jagga-tech
          base: header, activity, community, repositories, metadata
          config_timezone: America/Los_Angeles
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_calendar: yes
          plugin_calendar_limit: 1
          # Match the README's dark tokyonight look: #0d0d0d bg, light text,
          # cyan accents, dark calendar empties instead of light grey.
          extras_css: |
            svg{background:#0d0d0d;color:#c8ccd1}
            .items-wrapper{background:#0b1417;border:1px solid #11343c;border-radius:12px}
            h2,.title{color:#00e5ff !important}
            a{color:#00e5ff !important}
            .value{color:#e6edf3 !important}
            rect.day[fill="#ebedf0"]{fill:#0d1b1f !important}
            rect.day[fill="#9be9a8"]{fill:#0a4a57 !important}
            rect.day[fill="#40c463"]{fill:#0e8ba3 !important}
            rect.day[fill="#30a14e"]{fill:#00bcd4 !important}
            rect.day[fill="#216e39"]{fill:#00e5ff !important}
